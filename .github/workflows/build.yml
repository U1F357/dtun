name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Verify and test
        run: |
          go version
          go mod verify
          test -z "$(gofmt -l cmd internal)"
          go test -race ./...
          go vet ./...
      - name: Real TUN lifecycle in isolated network namespace
        run: |
          go test -c -o /tmp/dtun-tun-test ./internal/tun
          sudo ip netns add dtun-ci
          trap 'sudo ip netns del dtun-ci' EXIT
          sudo ip netns exec dtun-ci env DTUN_TEST_TUN=1 /tmp/dtun-tun-test -test.v -test.run '^TestCloseUnblocksRead$'
  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Package
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: linux
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/package
          go build -trimpath -ldflags='-s -w' -o dist/package/dtun ./cmd/dtun
          go build -trimpath -ldflags='-s -w' -o dist/package/dtun-keygen ./cmd/dtun-keygen
          cp README.md CONFIGURATION.md CHANGELOG.md dist/package/
          mkdir -p dist/package/docs
          cp docs/WINDOWS.md dist/package/docs/
          mkdir -p dist/package/scripts
          cp scripts/certgen.sh dist/package/scripts/
          printf 'commit=%s\nref=%s\n' "$GITHUB_SHA" "$GITHUB_REF" > dist/package/BUILDINFO.txt
          go version >> dist/package/BUILDINFO.txt
          tar -C dist/package -czf "dist/dtun_linux_${GOARCH}.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dtun-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Fetch verified Wintun
        shell: pwsh
        run: ./scripts/fetch-wintun.ps1 -Destination "$env:RUNNER_TEMP/wintun-sdk"
      - name: Native Windows tests and real Wintun packets
        if: matrix.arch == 'amd64'
        shell: pwsh
        run: |
          go mod verify
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test -race ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/dtun-test" | Out-Null
          go test -race -c -o "$env:RUNNER_TEMP/dtun-test/tun.test.exe" ./internal/tun
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP/wintun-sdk/wintun/bin/amd64/wintun.dll" "$env:RUNNER_TEMP/dtun-test/"
          $before = @(Get-NetRoute -DestinationPrefix '0.0.0.0/0' | Select-Object InterfaceIndex,NextHop,RouteMetric | ConvertTo-Json -Compress)
          $env:DTUN_TEST_WINTUN = '1'
          & "$env:RUNNER_TEMP/dtun-test/tun.test.exe" '-test.v' '-test.timeout=2m' '-test.run=^TestWintunPacketsAndClose$'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $after = @(Get-NetRoute -DestinationPrefix '0.0.0.0/0' | Select-Object InterfaceIndex,NextHop,RouteMetric | ConvertTo-Json -Compress)
          if (Compare-Object $before $after) { throw 'Default routes changed' }
          if (Get-NetAdapter -Name 'dtun-ci' -ErrorAction SilentlyContinue) { throw 'Test adapter leaked' }
      - name: Package Windows
        shell: pwsh
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          go build -trimpath -ldflags='-s -w' -o dist/package/dtun.exe ./cmd/dtun
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go build -trimpath -ldflags='-s -w' -o dist/package/dtun-keygen.exe ./cmd/dtun-keygen
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP/wintun-sdk/wintun/bin/$env:GOARCH/wintun.dll" dist/package/
          Copy-Item "$env:RUNNER_TEMP/wintun-sdk/wintun/LICENSE.txt" dist/package/WINTUN-LICENSE.txt
          Copy-Item README.md,CONFIGURATION.md,CHANGELOG.md dist/package/
          New-Item -ItemType Directory -Force dist/package/docs | Out-Null
          Copy-Item docs/WINDOWS.md,docs/THIRD-PARTY-WINTUN.txt dist/package/docs/
          @("commit=$env:GITHUB_SHA", "ref=$env:GITHUB_REF", (go version)) | Set-Content dist/package/BUILDINFO.txt
          Compress-Archive -Path dist/package/* -DestinationPath "dist/dtun_windows_$env:GOARCH.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dtun-windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dtun-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          flags=()
          if [[ "$TAG" == v0.* || "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" ./*.tar.gz ./*.zip SHA256SUMS --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
